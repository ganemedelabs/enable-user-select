<!doctype html>
<html lang="en" dir="__MSG_@@bidi_dir__">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title data-i18n="extensionName">Enable User Select</title>
        <meta name="description" content="Forces user-select property to be enabled on all elements." />
        <link rel="stylesheet" href="popup.css" />
        <link rel="manifest" href="manifest.json" />
    </head>

    <body>
        <h1>
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-text-cursor-input preview-icon"
            >
                <path d="M12 20h-1a2 2 0 0 1-2-2 2 2 0 0 1-2 2H6" />
                <path d="M13 8h7a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-7" />
                <path d="M5 16H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h1" />
                <path d="M6 4h1a2 2 0 0 1 2 2 2 2 0 0 1 2-2h1" />
                <path d="M9 6v12" />
            </svg>
            <span data-i18n="extensionName">Enable User Select</span>
        </h1>

        <div class="toggle-container">
            <label for="main-toggle" class="toggle-label">
                <span data-i18n="toggleNormalLabel">Enable text selection</span>
                <div class="toggle" role="switch">
                    <input type="checkbox" id="main-toggle" class="toggle-input" />
                    <span class="toggle-slider"></span>
                </div>
            </label>
        </div>

        <div class="toggle-container">
            <label for="aggressive-toggle" class="toggle-label">
                <span data-i18n="toggleAggressiveLabel">Aggressive mode</span>
                <div class="toggle" role="switch">
                    <input type="checkbox" id="aggressive-toggle" class="toggle-input" />
                    <span class="toggle-slider"></span>
                </div>
            </label>
            <small class="toggle-description" data-i18n="toggleAggressiveDesc">
                Unblocks sites that use JavaScript to disable selection. Use only if normal mode doesn't work — this may
                break some interactive pages.
            </small>
        </div>

        <button id="capture-btn" class="action-btn">
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-files preview-icon"
            >
                <path d="M15 2h-4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V8" />
                <path d="M16.706 2.706A2.4 2.4 0 0 0 15 2v5a1 1 0 0 0 1 1h5a2.4 2.4 0 0 0-.706-1.706z" />
                <path d="M5 7a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h8a2 2 0 0 0 1.732-1" />
            </svg>
            <span>Copy Page to New Tab</span>
        </button>

        <div class="info-box" role="region" data-i18n="infoBoxText">
            Enabling this extension allows you to freely select and copy text on web pages that may have restricted text
            selection.
        </div>

        <script src="popup.js"></script>
    </body>
</html>
