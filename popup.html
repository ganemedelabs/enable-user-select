<!doctype html>
<html lang="en" dir="__MSG_@@bidi_dir__">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title data-i18n="extensionName">Enable User Select</title>
        <meta name="description" content="Forces user-select property to be enabled on all elements." />
        <link rel="stylesheet" href="popup.css" />
        <link rel="manifest" href="manifest.json" />
    </head>

    <body>
        <h1 data-i18n="extensionName">Enable User Select</h1>

        <div class="toggle-container">
            <label for="main-toggle" class="toggle-label">
                <span data-i18n="toggleNormalLabel">Enable text selection</span>
                <div class="toggle" role="switch">
                    <input type="checkbox" id="main-toggle" class="toggle-input" />
                    <span class="toggle-slider"></span>
                </div>
            </label>
        </div>

        <div class="toggle-container">
            <label for="aggressive-toggle" class="toggle-label">
                <span data-i18n="toggleAggressiveLabel">Aggressive mode</span>
                <div class="toggle" role="switch">
                    <input type="checkbox" id="aggressive-toggle" class="toggle-input" />
                    <span class="toggle-slider"></span>
                </div>
            </label>
            <small class="toggle-description" data-i18n="toggleAggressiveDesc">
                Unblocks sites that use JavaScript to disable selection. Use only if normal mode doesn't work — this may
                break some interactive pages.
            </small>
        </div>

        <div class="info-box" role="region" data-i18n="infoBoxText">
            Enabling this extension allows you to freely select and copy text on web pages that may have restricted text
            selection.
        </div>

        <script src="popup.js"></script>
    </body>
</html>
